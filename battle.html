<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚔ 宅建バトル魔導書｜クイズでレベルアップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--font:'Outfit','Noto Sans JP',sans-serif;--bg:#0f0a18;--panel:#1a1225;--panel-border:rgba(212,168,83,.15);--gold:#d4a853;--gold-light:#f0d68a;--hp:#22c55e;--hp-bg:rgba(34,197,94,.15);--mp:#6366f1;--mp-bg:rgba(99,102,241,.15);--text:#e8dcc8;--text-dim:#988c78;--rune:#7b5ea7;--blood:#ef4444}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg-particles{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 30% 20%,rgba(123,94,167,.08),transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(212,168,83,.05),transparent 50%)}
.wrap{max-width:500px;margin:0 auto;padding:12px 16px 40px;width:100%;position:relative;z-index:1;flex:1;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 12px}
.header h1{font-size:16px;font-weight:900;color:var(--gold);letter-spacing:1px}
.header h1 span{color:#8a6e3a}
.header .lv{font-size:12px;font-weight:700;color:var(--rune);background:rgba(123,94,167,.12);padding:4px 12px;border-radius:6px;border:1px solid rgba(123,94,167,.2)}
.field{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;min-height:200px;margin:4px 0 8px}
.enemy-wrapper{text-align:center;position:relative}
.enemy-sprite{font-size:80px;line-height:1;display:inline-block;transition:.3s;filter:drop-shadow(0 0 20px rgba(212,168,83,.15))}
.enemy-sprite.hit{animation:enemyHit .4s ease}
@keyframes enemyHit{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.enemy-name{font-size:14px;font-weight:800;color:var(--gold-light);margin-top:4px}
.enemy-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.hp-bar-wrap{margin:8px auto 0;max-width:320px}
.hp-bar-label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--text-dim);margin-bottom:3px}
.hp-bar{height:14px;background:rgba(255,255,255,.06);border-radius:7px;overflow:hidden;border:1px solid rgba(239,68,68,.2)}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#22c55e);border-radius:7px;transition:width .5s ease;width:100%}
.player-panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:14px;padding:14px 16px;margin:4px 0}
.player-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.player-row:last-child{margin-bottom:0}
.player-name{font-size:14px;font-weight:800;color:var(--gold-light)}
.player-name span{font-size:11px;color:var(--text-dim);font-weight:600}
.stat-bar{flex:1;min-width:60px;margin:0 8px;height:12px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.stat-bar-fill.hp{background:linear-gradient(90deg,#22c55e,#4ade80)}
.stat-bar-fill.mp{background:linear-gradient(90deg,#6366f1,#818cf8)}
.stat-val{font-size:11px;font-weight:700;min-width:48px;text-align:right;color:var(--text-dim)}
.log{background:rgba(0,0,0,.3);border-radius:10px;padding:10px 14px;margin:4px 0;min-height:44px;max-height:60px;overflow-y:auto;font-size:12px;color:var(--text-dim);line-height:1.6}
.log .dmg{color:var(--blood);font-weight:700}.log .heal{color:#4ade80;font-weight:700}.log .xp{color:var(--gold);font-weight:700}
.answers{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.ans-btn{width:100%;padding:12px 14px;text-align:left;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--text);font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;transition:.2s;line-height:1.4}
.ans-btn:hover{background:rgba(212,168,83,.08);border-color:rgba(212,168,83,.2);transform:translateY(-1px)}
.ans-btn:active{transform:translateY(0)}
.ans-btn:disabled{cursor:not-allowed;opacity:.5}
.ans-btn.correct{background:rgba(34,197,94,.12)!important;border-color:#22c55e!important;color:#4ade80}
.ans-btn.wrong{background:rgba(239,68,68,.12)!important;border-color:#ef4444!important;color:#fca5a5}
.action-btn{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:800;font-family:var(--font);cursor:pointer;transition:.2s;border:none;margin-top:8px;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#1a1220}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(212,168,83,.3)}
.action-btn.secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.action-btn.secondary:hover{background:rgba(255,255,255,.1)}
.area-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.area-tag.r{background:rgba(34,197,94,.12);color:#4ade80}
.area-tag.l{background:rgba(244,63,94,.12);color:#fda4af}
.area-tag.t{background:rgba(212,168,83,.12);color:var(--gold-light)}
.area-tag.z{background:rgba(6,182,212,.12);color:#67e8f9}
.modal-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--panel-border);border-radius:20px;padding:28px 24px;max-width:400px;width:100%;text-align:center}
.modal h2{font-size:22px;font-weight:900;color:var(--gold);margin-bottom:8px}
.modal p{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:16px}
.modal .big-icon{font-size:64px;margin-bottom:8px}
.modal .detail{font-size:12px;color:var(--text-dim);margin-top:8px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .5s ease}
.stage{font-size:11px;color:var(--text-dim);text-align:center;margin:2px 0 6px}
.hidden{display:none}
</style>
</head>
<body>
<div class="bg-particles"></div>
<div class="wrap">
<div class="header"><h1>⚔ 宅建<span>バトル</span></h1><div class="lv">Lv.<span id="playerLv">1</span></div></div>
<div class="stage" id="stageInfo">第1戦 • 権利関係の間</div>
<div class="field">
<div class="enemy-wrapper"><div class="enemy-sprite" id="enemySprite">⚖️</div><div class="enemy-name" id="enemyName">制限能力の門番</div><div class="enemy-desc" id="enemyDesc">権利関係</div></div>
<div class="hp-bar-wrap"><div class="hp-bar-label"><span id="enemyHpLabel">HP 100</span><span id="enemyHpPct">100%</span></div><div class="hp-bar"><div class="hp-bar-fill" id="enemyHpBar" style="width:100%"></div></div></div></div>
<div class="player-panel">
<div class="player-row"><div class="player-name">🧙 魔法使い <span id="playerTitle">見習い</span></div><div class="stat-val" id="xpDisplay">0/100</div></div>
<div class="player-row"><div style="font-size:11px;font-weight:600;min-width:28px">HP</div><div class="stat-bar"><div class="stat-bar-fill hp" id="playerHpBar" style="width:100%"></div></div><div class="stat-val" id="playerHpVal">30/30</div></div>
<div class="player-row"><div style="font-size:11px;font-weight:600;min-width:28px">MP</div><div class="stat-bar"><div class="stat-bar-fill mp" id="playerMpBar" style="width:100%"></div></div><div class="stat-val" id="playerMpVal">20/20</div></div></div>
<div class="log" id="log">⚔ 敵が現れた！ 正解して攻撃だ！</div>
<div class="answers" id="answerArea"></div>
<div id="actionArea"></div></div>
<div class="modal-overlay" id="resultModal">
<div class="modal"><div class="big-icon" id="resultIcon">🏆</div><h2 id="resultTitle">勝利！</h2><p id="resultDesc">撃破！</p><div class="detail" id="resultDetail"></div>
<button class="action-btn" onclick="nextBattle()" id="resultBtn">次の戦闘へ</button>
<button class="action-btn secondary" style="margin-top:8px" onclick="closeResult()">閉じる</button></div></div>

<script>
// ===== 問題データ（既存53問＋PDF102問＝155問相当、重複除去） =====
const QUESTIONS = {"rights":[
{q:"未成年が契約する場合、法定代理人の同意が必要？",a:["必要","不要","場合による","取消し不可"],c:0,tag:"権利関係"},
{q:"成年被後見人の法律行為は？",a:["取り消せる","有効","無効","追認不要"],c:0,tag:"権利関係"},
{q:"錯誤による法律行為の効果は？",a:["取り消せる","無効","有効","追認可"],c:0,tag:"意思表示"},
{q:"詐欺による意思表示の効果は？",a:["取り消せる","無効","有効","当然無効"],c:0,tag:"意思表示"},
{q:"代理行為の要件として不要なのは？",a:["本人の能力","顕名","代理権","相手方"],c:0,tag:"代理"},
{q:"表見代理が成立する要件は？",a:["本人の帰責性","本人の同意","書面契約","登記"],c:0,tag:"代理"},
{q:"取得時効の期間は？(所有権)",a:["20年/10年","5年/3年","30年","1年"],c:0,tag:"時効"},
{q:"消滅時効の起算点は？",a:["権利行使可能時","契約時","損害発生時","裁判時"],c:0,tag:"時効"},
{q:"不動産物権変動の対抗要件は？",a:["登記","引渡し","契約書","合意"],c:0,tag:"物権変動"},
{q:"動産物権変動の対抗要件は？",a:["引渡し","登記","書面","登録"],c:0,tag:"物権変動"},
{q:"占有権と所有権の違いは？",a:["占有権は事実状態","所有権は事実状態","同じ","占有権は権利でない"],c:0,tag:"占有権"},
{q:"地上権の存続期間は？",a:["自由(合意)","20年","30年","50年"],c:0,tag:"用益物権"},
{q:"抵当権の目的物は？",a:["不動産・地上権等","動産のみ","債権のみ","すべての財産権"],c:0,tag:"抵当権"},
{q:"根抵当権の極度額とは？",a:["債権の上限額","利息額","弁済額","遅延損害金"],c:0,tag:"根抵当"},
{q:"債権の消滅事由でないのは？",a:["契約更新","弁済","相殺","免除"],c:0,tag:"債権総論"},
{q:"契約はいつ成立する？",a:["承諾通知到達時","申込時","契約書作成時","手付受領時"],c:0,tag:"契約総論"},
{q:"同時履行の抗弁権とは？",a:["相手の履行まで拒める","常に拒否可","取消し可","無効"],c:0,tag:"契約総論"},
{q:"売買契約は何契約？",a:["諸成契約","要物契約","片務契約","無償契約"],c:0,tag:"契約各論"},
{q:"請負契約の目的は？",a:["仕事の完成","事務処理","物の保管","金銭貸与"],c:0,tag:"契約各論"},
{q:"不法行為の成立要件で不要なのは？",a:["合意","故意過失","損害","因果関係"],c:0,tag:"不法行為"},
{q:"使用者責任で免責されるのは？",a:["選任監督に相当注意","無過失","被害者同意","不可抗力"],c:0,tag:"不法行為"},
{q:"法定相続分(配偶者+子)の配偶者割合は？",a:["1/2","2/3","3/4","全部"],c:0,tag:"相続"},
{q:"借地権の存続期間は？",a:["30年","20年","50年","10年"],c:0,tag:"借地借家"},
{q:"法律行為に関する記述で正しいのは？",a:["意思能力なければ無効","公序良俗違反も有効","詐欺は当然無効","他人物の売買は無効"],c:0,tag:"意思表示"},
{q:"委任契約の誤った記述は？",a:["注意義務を負うことがある","復受任者は許可が必要","死亡で代理権消滅しない合意可","仕事完成で報酬"],c:1,tag:"契約各論"},
{q:"共有に関する記述で正しいのは？",a:["過半数の同意で変更可","所在不明共有者あり","3人で賃貸可","裁判所決定で取得可"],c:0,tag:"物権変動"},
{q:"履行遅滞の記述で正しいのは？",a:["不法行為は請求時から","善意受益者は請求時から","相殺後の残債務は請求時から","不確定期限は知ってから"],c:0,tag:"債権総論"},
].map(q=>({...q,area:'r'})),
"regulations":[
{q:"市街化区域の開発許可規模は？",a:["1,000㎡以上","500㎡以上","3,000㎡以上","無条件"],c:0,tag:"都市計画法"},
{q:"工業専用地域で建築できないのは？",a:["住宅","工場","倉庫","店舗"],c:0,tag:"用途地域"},
{q:"建築確認が必要なのは？",a:["3階以上","平屋","10㎡物置","農業倉庫"],c:0,tag:"建築基準法"},
{q:"建蔽率とは？",a:["建築面積÷敷地面積","延床面積÷敷地面積","高さ÷幅","階数"],c:0,tag:"建築基準法"},
{q:"道路斜線制限の目的は？",a:["道路の日照確保","隣地プライバシー","防火","景観"],c:0,tag:"建築基準法"},
{q:"規制区域の土地取引は？",a:["許可制","届出制","自由","禁止"],c:0,tag:"国土利用計画法"},
{q:"農地転用で両方必要な許可は？",a:["5条許可","3条許可","4条許可","不要"],c:0,tag:"農地法"},
{q:"宅地造成の許可が必要な区域は？",a:["宅地造成工事規制区域","市街化区域","都市計画区域","すべて"],c:0,tag:"宅地造成"},
{q:"換地とは？",a:["新しい土地を割当て","土地の一部提供","事業費に充てる土地","暫定使用"],c:0,tag:"区画整理"},
{q:"景観計画区域内の建築行為は？",a:["届出制","許可制","自由","禁止"],c:0,tag:"景観法"},
].map(q=>({...q,area:'l'})),
"rea":[
{q:"宅建業免許の有効期間は？",a:["5年","3年","10年","1年"],c:0,tag:"宅建業法"},
{q:"大臣免許が必要なのは？",a:["2以上の都道府県","1県のみ","全国","指定都市"],c:0,tag:"宅建業法"},
{q:"35条書面の説明者は？",a:["宅建士","宅建業者","誰でも","行政書士"],c:0,tag:"宅建業法"},
{q:"クーリングオフの期間は？",a:["8日間","7日間","10日間","14日間"],c:0,tag:"宅建業法"},
{q:"37条書面の交付時期は？",a:["契約後遅滞なく","契約前","登記時","引渡時"],c:0,tag:"宅建業法"},
{q:"営業保証金の主たる金額は？",a:["1,000万円","500万円","2,000万円","300万円"],c:0,tag:"宅建業法"},
{q:"保証協会の弁済限度額は？",a:["800万円","1,000万円","500万円","無制限"],c:0,tag:"宅建業法"},
{q:"業務停止処分の期間は？",a:["1年以内","6ヶ月","2年","無期限"],c:0,tag:"宅建業法"},
{q:"無免許営業の罰則は？",a:["3年以下の懲役","1年以下","罰金のみ","過料"],c:0,tag:"宅建業法"},
{q:"鑑定評価の3手法でないのは？",a:["市場比較法","原価法","取引事例比較法","収益還元法"],c:0,tag:"鑑定評価"},
{q:"登記簿で所有権を記載するのは？",a:["甲区","表題部","乙区","丙区"],c:0,tag:"登記法"},
{q:"フラット35の特徴は？",a:["全期間固定金利","変動金利","期間限定","当初固定"],c:0,tag:"住宅金融"},
].map(q=>({...q,area:'t'})),
"tax":[
{q:"不動産取得税の標準税率は？",a:["4%","3%","5%","2%"],c:0,tag:"税"},
{q:"登録免許税の移転登記税率は？",a:["2%","0.4%","1%","5%"],c:0,tag:"税"},
{q:"印紙税1,000万超〜5,000万以下は？",a:["10,000円","5,000円","30,000円","1,000円"],c:0,tag:"税"},
{q:"電子契約の印紙税は？",a:["不要","必要","半額","場合による"],c:0,tag:"税"},
{q:"長期譲渡所得の税率は？",a:["20.315%","39.63%","15%","30%"],c:0,tag:"税"},
{q:"居住用財産の特別控除額は？",a:["3,000万円","1,000万円","5,000万円","無制限"],c:0,tag:"税"},
{q:"地価公示の基準日は？",a:["1月1日","4月1日","7月1日","10月1日"],c:0,tag:"統計"},
{q:"区分所有法の建替え決議は？",a:["4分の3以上","過半数","全員一致","3分の2以上"],c:0,tag:"区分所有"},
].map(q=>({...q,area:'z'}))
};
QUESTIONS.pdf_r = [{"q":"所有者ＡがＢに甲土地を売却し、その後にＢがＣに甲土地を売却した場合に関す","a":["甲土地の所有権登記がＡの名義のままであったとしても、Ｂは、Ｃに甲土地を売却した後 は、Ａに対して自己に甲土地の所有権移転登記をするよう請求することはできない。","Ｃは、甲土地の所有権移転登記を備えなければ、Ａに対して自己が所有者であることを主 張することができない。","ＡＢ間の売買契約が、ＢＣ間の売買契約締結よりも前にＡにより解除されていた場合、又 は、 ＢＣ間の売買契約締結後にＡにより解除された場合のいずれの場合であっても、 Ｃ は、甲土地の所有権移転登記を備えれば、Ａに対して自己の所有権を主張することができ る。","ＡＢ間の売買契約が、ＢＣ間の売買契約よりも前にＢの強迫を理由として取り消されてい た場合、又は、ＢＣ間の売買契約締結後にＢの強迫を理由として取り消された場合のいずれ の場合であっても、Ｃは、Ｂの強迫につき善意でかつ過失がなければ、Ａに対して自己の所 有権を主張することができる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"個人であるＡが、①賃貸人Ｂと賃借人Ｃとの間の期間を 2 年とする居住用甲建物","a":["①の連帯保証契約は書面によってしなければ無効であるのに対し、②の保証契約は書面に よらず、口頭で契約を締結しても有効である。","①のＢがＡに対して連帯保証債務の履行を請求してきた場合には、ＡはまずＣに請求する ように主張できるのに対し、 ②のＤがＡに対して保証債務の履行を請求してきた場合に は、ＡはまずＥに請求するように主張することはできない。","①の連帯保証契約は保証の限度額である極度額を定めなければ無効であるのに対し、②の 保証契約は極度額を定める必要はない。","①も②もＡが主たる債務者Ｃ及びＥの委託を受けて保証した場合において、Ａが債権者Ｂ 及びＤに対して主たる債務の履行状況に関する情報を提供するよう請求したときは、①のＢ は、これらの情報を、遅滞なく、Ａに提供しなければならないのに対し、②のＤは、守秘義 務を理由にこれらの情報の提供を拒否することができる。 1 AB.indd 1 2025/08/22 18:29:07"],"c":1,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"意思表示に関する次の記述のうち、民法の規定によれば、誤っているものはいく","a":["一つ","二つ","三つ","四つ"],"c":2,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"ＡがＢから弁済の期限の定めなく金 1,000 万円を借り入れる金銭消費貸借契約","a":["Ａは、本件契約におけるＡの債務を担保するために、Ａが所有する不動産に対し、Ｂのた めに、抵当権を設定することはできるが、質権を設定することはできない。","Ａが本件契約に基づく債務の弁済を怠ったときに、ＢがＡから預かっている動産を占有し ている場合には、Ｂは当該動産の返還時期が到来しても弁済を受けるまでその動産に関して 留置権を行使することができる。","Ａが本件契約に基づく債務の弁済を怠った場合には、ＢはＡの総財産に対して先取特権を 行使することができる。","Ａが、期限が到来しているＢの悪意による不法行為に基づく金 1,000 万円の損害賠償請求 債権をＢに対して有している場合、Ａは本件契約に基づく返還債務をＢに対する当該損害賠 償請求債権で相殺することができる。 2 AB.indd 2 2025/08/22 18:29:08"],"c":3,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａの子がＢであり、 Ｂの子がＣであり、 ＣがＡの直系卑属である場合におい","a":["ア、エ","イ、ウ","ア、ウ、エ","ア、イ、ウ"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａが所有している甲土地についての物権変動に関する次の記述のうち、民法の規","a":["Ｂが甲土地をＡに無断でＣに売却し、 その後、 ＢがＡから甲土地を購入した場合、 Ｃ は、Ｂから甲土地を購入した時点に遡って甲土地の所有権を取得する。","Ｄが甲土地につき、Ａに無断でＤへの虚偽の所有権の移転の登記をした上で、甲土地をＥ に売却してその旨の登記をした場合において、 その後、 ＡがＦに甲土地を売却したとき は、Ｆは、Ｅに対し、甲土地の所有権を主張することができる。","Ｇが甲土地の所有権を時効取得した場合、Ｇはその後にＡを単独相続したＨに対して、登 記を備えていなくても、甲土地の所有権を主張することができる。","Ａが甲土地上の立木の所有権を留保して甲土地をＪに売却し、その後、ＪがＫに甲土地及 びその上の立木を売却した場合には、Ａは、Ｋに対し、立木の所有権の留保につき登記又は 明認方法を備えない限り、立木の所有権を主張することができない。 3 AB.indd 3 2025/08/22 18:29:08"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａは自己の所有する甲建物を事務所としてＢに賃貸し（以下この問において「本","a":["ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除された ことにより甲建物はＡに明け渡された。この場合、ＣはＡに対して、事務管理に基づいて修 理費用相当額の支払を求めることはできない。","ＢがＣに修理代金を支払ったとしても、本件契約において、Ａの負担に属するとされる甲 建物の屋根の修理費用について直ちに償還請求することができる旨の特約がない限り、契約 終了時でなければ、ＢはＡに対して償還を求めることはできない。","ＢがＣに修理代金を支払わない場合、Ｃは、Ｂが占有する甲建物につき、当然に不動産工 事の先取特権を行使することができる。","ＢがＣに修理代金を支払わないまま無資力となり、賃料を滞納して本件契約が解除された ことにより甲建物はＡに明け渡された。本件契約において、ＢがＡに権利金を支払わないこ との代償として、甲建物の修理費用をＢの負担とする旨の特約が存し、当該屋根の修理費用 と権利金が相応していたときであっても、ＣはＡに対して、不当利得に基づいて修理費用相 当額の支払を求めることができる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａ、Ｂ及びＣがそれぞれ 3 分の 1 の持分の割合で甲土地を共有している場合に関","a":["甲土地につき無権利のＤが、自己への虚偽の所有権移転登記をした場合には、Ａは、単独 で、Ｄに対し、その所有権移転登記の抹消を求めることができる。","Ａが甲土地についての自己の持分を放棄した場合には、その持分は国庫に帰属する。","Ａが死亡し、Ｅ及びＦが相続した場合には、Ｂ及びＣは、Ａの遺産についての遺産分割が される前であっても、Ｅ及びＦに対して共有物分割の訴えを提起することができる。","ＡがＢ及びＣに無断で甲土地を占有している場合であっても、Ｂは、Ａに対し、当然には 自己に甲土地を明け渡すように求めることができない。 4 AB.indd 4 2025/08/22 18:29:08"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"連帯債務者の一人について生じた次の事由のうち、民法の規定によれば、他の連","a":["債権者がした連帯債務者の一人に対する履行の請求","連帯債務者の一人と債権者との間の混同","連帯債務者の一人が債権者に対して債権を有する場合において、その連帯債務者がした相 殺の援用","連帯債務者の一人と債権者との間の更改"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａを売主、Ｂを買主とする甲土地の売買契約による甲土地の引渡し後に、目的物","a":["Ｂは、甲土地の引渡しの日から 11 年が経過した時点で甲土地の土壌汚染を発見し、発見 した時点から 1 年以内にＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知ら なかった場合、Ａが宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求する ことはできない。","甲土地の引渡しの日から 3 年以内に契約不適合の通知をしなければ売主は契約不適合責任 を負わない旨の特約があり、Ｂが引渡しの日から 4 年が経過した時点で土壌汚染を発見して 直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過失なく知らなかった場合、Ａ が宅地建物取引業者であるか否かにかかわらず、Ｂは損害賠償を請求することはできない。","甲土地の引渡しの日から 1 年以内に契約不適合の通知をしなければ売主は契約不適合責任 を負わない旨の特約があり、Ａは甲土地に土壌汚染があることを売買契約締結時点で知って いて告げていなかった。Ｂが引渡しの日から 3 年が経過した時点で当該土壌汚染を発見して 直ちにＡに通知した場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請 求できるか否かの結論が異なる。","売主は契約不適合責任を一切負わない旨の特約があり、Ｂは引渡しの日から 1 年が経過し た時点で土壌汚染を発見して直ちにＡに通知した。Ａが当該土壌汚染があることを重大な過 失なく知らなかった場合、Ａが宅地建物取引業者であるか否かによって、Ｂが損害賠償を請 求できるか否かの結論が異なる。 5 AB.indd 5 2025/08/22 18:29:08"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"ＡがＢとの間で、Ａ所有の甲土地につき建物の所有を目的として一時使用目的で","a":["甲土地にＢが賃借権の登記をしなくても、Ｂの配偶者であるＣを所有者として登記されて いる建物が甲土地上に存在する場合には、甲土地がＡからＤに売却されても、ＢはＤに対し て甲土地に賃借権を有していることを主張できる。","本件契約の存続期間が 50 年であり、契約の更新及び建物の築造による存続期間の延長が ない旨を定める場合、一定期間地代を減額せず、その期間は地代の減額請求ができない旨の 特約を有効に定めることができる。","本件契約が専らＢの事業の用に供する建物の所有を目的とし、存続期間が 50 年である場 合、契約の更新及び建物の築造による存続期間の延長がない旨、並びにＢが借地借家法第","3 条の規定による建物の買取りの請求をしない旨の特約を書面で有効に定めることができ る。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"Ａを賃貸人、Ｂを賃借人とする甲建物の賃貸借契約（定期建物賃貸借契約及び一","a":["本件契約が期間の定めがないものである場合において、Ａ又はＢから相手方に対して解約 の申入れをしたときは、当該申入れの日から 6 か月を経過することによって、本件契約は終 了する。","本件契約が期間を 2 年とするものである場合において、Ａ及びＢのいずれも期間の満了の","年前から 6 か月前までの間に相手方に対して更新をしない旨の通知をしなかったとき は、本件契約は、期間を 2 年として、従前の契約と同一の条件で更新されたものとみなされ る。","ＡＢ間において、造作買取請求権は行使しない旨の特約があった場合、この特約は有効で ある。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"建物の区分所有等に関する法律に関する次の記述のうち、誤っているものはどれ","a":["共用部分は、原則として区分所有者全員の共有に属するが、規約で別段の定めをすること を妨げず、管理者であっても、規約に特別の定めがあるときは、共用部分を所有することが できる。","共用部分の持分の割合について、各共有者の共用部分の持分は、規約で別段の定めをしな い限り、その有する専有部分の床面積の割合による。","集会の議事については、議長は、書面又は電磁的記録により、議事録を作成しなければな らず、当該議事録には議事の経過の要領及びその結果を記載し、又は記録しなければならな いとされているが、当該議事録が書面で作成されているときは、議長及び集会に出席した区 分所有者全員がこれに署名しなければならない。","区分所有者が、建物の保存に有害な行為その他建物の管理又は使用に関し区分所有者の共 同の利益に反する行為をした場合又はその行為をするおそれがある場合には、他の区分所有 者の全員又は管理組合法人は、区分所有者の共同の利益のため、その行為を停止し、その行 為の結果を除去し、又はその行為を予防するため必要な措置を執ることを請求することがで きる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R7"},{"q":"法律行為に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","a":["営業を許された未成年者が、その営業に関する意思表示をした時に意思能力を有しなかっ た場合は、その法律行為は無効である。","公の秩序に反する法律行為であっても、当事者が納得して合意した場合には、その法律行 為は有効である。","詐欺による意思表示は取り消すことによって初めから無効であったとみなされるのに対し、 強迫による意思表示は取り消すまでもなく無効である。","他人が所有している土地を目的物にした売買契約は無効であるが、当該他人がその売買契 約を追認した場合にはその売買契約は有効となる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"委任契約・準委任契約に関する次の記述のうち、民法の規定及び判例によれば、","a":["売主が、売買契約の付随義務として、買主に対して、マンション専有部分内の防火戸の操 作方法につき説明義務を負う場合、業務において密接な関係にある売主から委託を受け、売 主と一体となって当該マンションの販売に関する一切の事務を行っていた宅地建物取引業者 も、買主に対して、防火戸の操作方法について説明する信義則上の義務を負うことがある。","受任者は、委任者の許諾を得たとき、又はやむを得ない事由があるときでなければ、復受 任者を選任することができない。","委任契約で本人が死亡しても代理権が消滅しない旨を合意して代理人に代理権を与えた場 合、本人が死亡しても代理権は消滅しない。","委任は、当事者の一方が仕事を完成することを相手方に約し、相手方がその仕事の結果に 対しその報酬を支払うことを約さなければ、その効力を生じない。 1"],"c":1,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"甲土地につき、Ａ、Ｂ、Ｃ、Ｄの 4 人がそれぞれ 4 分の 1 の共有持分を有してい","a":["甲土地に、その形状又は効用の著しい変更を伴う変更を加える場合には、共有者の過半数 の同意が必要であり、本件ではＡ、Ｂ、Ｃ 3 人の同意が必要となる。","甲土地の所有権の登記名義人となっている者が所有者ではないＥである場合、持分に基づ いてＥに対して登記の抹消を求めるためには、所在が判明しているＡ、Ｂ、Ｃのうち 2 人の 同意が必要である。","Ａ、Ｂ、Ｃ 3 人の同意があれば、甲土地を資材置場として賃借したいＦとの間で期間を 3 年とする賃貸借契約を締結することができる。","Ａが裁判所に請求して、裁判所がＤの持分をＡに取得させる旨の決定をした場合、Ｄは、 その決定から 3 年以内に限り、Ａが取得したＤの共有持分の時価相当額をＡに対して支払う よう請求することができる。"],"c":2,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"Ａを売主、Ｂを買主として甲土地の売買契約（以下この問において「本件契約」","a":["売買代金を受領したＣが甲土地の引渡しを拒絶する意思を明確に表示したとしても、Ｂは、 Ｃに対して相当の期間を定めた催告をしなければ、本件契約を解除することができない。","Ｂが期日までに売買代金を支払わない場合であっても、本件契約の解除権はＡの一身に専 属した権利であるため、Ｃは本件契約を解除することはできない。","Ｂは、売買代金が支払い済みだったとしても、甲土地の所有権登記を備えなければ、Ｃに 対して甲土地の引渡しを請求することはできない。","本件契約が、Ａの詐欺により締結されたものである場合、ＢはＣに対して、本件契約の取 消しを主張することができる。 2"],"c":3,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"履行遅滞に関する次の記述のうち、民法の規定及び判例によれば、正しいものは","a":["不法行為の加害者は、不法行為に基づく損害賠償債務について、履行の請求を受けた時か ら遅滞の責任を負う。","善意の受益者は、その不当利得返還債務について、履行の請求を受けた時から遅滞の責任 を負う。","請負人の報酬債権に対して、注文者がこれと同時履行の関係にある目的物の瑕疵修補に代 わる損害賠償債権を自働債権とする相殺の意思表示をした場合、注文者は、請負人に対する 相殺後の報酬残債務について、当該残債務の履行の請求を受けた時から遅滞の責任を負う。","債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを知っ た後に履行の請求を受けた時から遅滞の責任を負う。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"Ａの所有する甲土地にＢを地上権者とする地上権（以下この問において「本件地","a":["一つ","二つ","三つ","なし 3"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"Ａを貸主、Ｂを借主として甲建物の賃貸借契約（以下この問において「本件契","a":["ＣがＢに対し甲建物をＡから買受けたとの虚偽の話をしたので、これを信じたＢが甲建物 の占有を任意にＣに移転した場合、ＡはＣに対して、占有回収の訴えにより甲建物の返還を 請求することはできない。","Ｂが、Ａの甲建物への立ち入りを建物入り口を閉ざして拒んだときは、Ａは甲建物の間接 占有が侵奪されたものとして、Ｂに対して、占有回収の訴えにより甲建物の返還を請求する ことができる。","Ｂが死亡して、ＤがＢを単独相続した場合、Ｄは相続開始を知るまでは、Ｂによる甲建物 の占有を承継しない。","ＡとＢのいずれもが死亡した場合、本件契約は当然に終了する。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"次の記述のうち、民法の条文として規定されていないものはどれか。","a":["隔地者間の契約は、承諾の通知を発した時に成立する。","無効な行為に基づく債務の履行として給付を受けた者は、相手方を原状に復させる義務を 負う。","代理人が自己又は第三者の利益を図る目的で代理権の範囲内の行為をした場合において、 相手方がその目的を知り、又は知ることができたときは、その行為は、代理権を有しない者 がした行為とみなす。","未成年者が法律行為をするには、その法定代理人の同意を得なければならない。ただし、 単に権利を得、又は義務を免れる法律行為については、この限りでない。 4"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"承諾に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","a":["第三者が債務者との間で、債務者の債務につき免責的債務引受契約をする場合、債権者の 承諾は不要である。","第三者が債務者との間で、債務者の債務につき併存的債務引受契約をした場合、債権者が 第三者に承諾をした時点で、その効力が生ずる。","第三者が債権者との間で、債務者の債務につき併存的債務引受契約をした場合、債務者が 第三者に承諾をした時点で、その効力が生ずる。","賃借人が賃貸借契約の目的物を第三者に転貸する場合、賃貸人の承諾は不要である。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"売買契約の目的物が品質に関して契約の内容に適合しない場合において、当該契","a":["履行の追完請求権、損害賠償請求権、契約の解除権","代金の減額請求権、損害賠償請求権、契約の解除権","履行の追完請求権、代金の減額請求権","損害賠償請求権 5"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"建物の所有を目的とする土地の賃貸借契約（一時使用目的の借地契約を除く。）","a":["専ら事業の用に供する建物（居住の用に供するものを除く。）の所有を目的とし、存続期 間を 20 年として借地権を設定する場合、建物買取請求権の規定は適用されず、また、その 契約は、公正証書による等書面によってしなければならない。","居住の用に供する建物の所有を目的として借地権を設定する場合において、借地権を消滅 させる目的で、その設定後 30 年を経過した日に借地権の目的である土地の上の建物を借地 権設定者に相当の対価で譲渡する旨の特約を定めても、この特約は無効である。","借地権を設定する場合において、存続期間を定めなかったときは、その期間は 30 年とな る。","当事者が借地権の設定後に最初に借地契約を更新する場合において、存続期間を定めな かったときは、その期間は更新の日から 10 年となる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"賃貸人Ａと賃借人Ｂとが、居住目的で期間を 3 年として、借地借家法第 38 条の","a":["Ｂが建物の引渡しを受けた後にＡが建物をＣに売却して建物所有者がＣに変わった場合、 Ｂは、契約①の場合ではＣに対して賃借人であることを主張できるが、契約②の場合ではＣ に対して賃借人であることを主張できない。","契約期間中は賃料の改定を行わない旨の特約を契約において定めていても、契約期間中に 賃料が不相当になったと考えるに至ったＢは、契約①の場合も契約②の場合も、借地借家法 第 32 条に基づく賃料減額請求をすることができる。","Ｂが契約期間中に相続人なしで死亡した場合において、婚姻はしていないが事実上夫婦と 同様の関係にあった同居者Ｄがあるときは、契約①の場合も契約②の場合も、Ａに反対の意 思表示をしないＤは、建物の賃貸借契約に関し、Ｂの権利義務を承継する。","契約①の場合、公正証書によって契約をするときに限り契約の更新がないことを有効に定 めることができ、契約②の場合、書面で契約し、かつ、Ａに正当な理由がない限り、Ａは契 約の更新を拒絶することができなくなる。 6"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R6"},{"q":"次の 1 から 4 までの記述のうち、民法の規定、判例及び下記判決文によれば、","a":["遺産である不動産から、相続開始から遺産分割までの間に生じた賃料債権は、遺産である 不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった場合、当該不 動産が帰属することになった相続人が相続開始時にさかのぼって取得する。","相続人が数人あるときは、相続財産は、その共有に属し、各共同相続人は、その相続分に 応じて被相続人の権利義務を承継する。","遺産分割の効力は、相続開始の時にさかのぼって生ずる。ただし、第三者の権利を害する ことはできない。","遺産である不動産が遺産分割によって複数の相続人のうちの一人に帰属することとなった 場合、当該不動産から遺産分割後に生じた賃料債権は、遺産分割によって当該不動産が帰属 した相続人が取得する。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"相隣関係に関する次の記述のうち、民法の規定によれば、正しいものはどれか。","a":["土地の所有者は、境界標の調査又は境界に関する測量等の一定の目的のために必要な範囲 内で隣地を使用することができる場合であっても、住家については、その家の居住者の承諾 がなければ、当該住家に立ち入ることはできない。","土地の所有者は、隣地の竹木の枝が境界線を越える場合、その竹木の所有者にその枝を切 除させることができるが、その枝を切除するよう催告したにもかかわらず相当の期間内に切 除しなかったときであっても、自らその枝を切り取ることはできない。","相隣者の一人は、相隣者間で共有する障壁の高さを増すときは、他方の相隣者の承諾を得 なければならない。","他の土地に囲まれて公道に通じない土地の所有者は、公道に出るためにその土地を囲んで いる他の土地を自由に選んで通行することができる。 1"],"c":1,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"Ａを注文者、Ｂを請負人として、Ａ所有の建物に対して独立性を有さずその構成","a":["ＡがＢに請負代金を支払っていなくても、Ａは増築部分の所有権を取得する。","Ｂが材料を提供して増築した部分に契約不適合がある場合、Ａは工事が終了した日から 1 年以内にその旨をＢに通知しなければ、契約不適合を理由とした修補をＢに対して請求する ことはできない。","Ｂが材料を提供して増築した部分に契約不適合があり、Ｂは不適合があることを知りなが らそのことをＡに告げずに工事を終了し、Ａが工事終了日から 3 年後に契約不適合を知った 場合、ＡはＢに対して、消滅時効が完成するまでは契約不適合を理由とした修補を請求する ことができる。","増築した部分にＡが提供した材料の性質によって契約不適合が生じ、Ｂが材料が不適当で あることを知らずに工事を終了した場合、ＡはＢに対して、Ａが提供した材料によって生じ た契約不適合を理由とした修補を請求することはできない。"],"c":2,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"ＡがＢに対して貸金債権である甲債権を、ＢがＡに対して貸金債権である乙債権","a":["ア、イ、ウ","イ、ウ","ウ、エ","エ 2"],"c":3,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"従来の住所又は居所を去った者（以下この問において「不在者」という。）の財","a":["不在者が管理人を置かなかったときは、当該不在者の生死が 7 年間明らかでない場合に限 り、家庭裁判所は、利害関係人又は検察官の請求により、その財産の管理について必要な処 分を命ずることができる。","不在者が管理人を置いた場合において、その不在者の生死が明らかでないときは、家庭裁 判所は、利害関係人又は検察官から請求があったとしても管理人を改任することはできない。","家庭裁判所により選任された管理人は、不在者を被告とする建物収去土地明渡請求を認容 した第一審判決に対して控訴を提起するには、家庭裁判所の許可が必要である。","家庭裁判所により選任された管理人は、保存行為として不在者の自宅を修理することがで きるほか、家庭裁判所の許可を得てこれを売却することができる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"Ａ所有の甲土地について、Ｂが所有の意思をもって平穏にかつ公然と時効取得に","a":["一つ","二つ","三つ","なし 3"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"甲建物を所有するＡが死亡し、Ａの配偶者Ｂが甲建物の配偶者居住権を、Ａの子","a":["遺産分割協議において、Ｂの配偶者居住権の存続期間が定められなかった場合、配偶者居 住権の存続期間は 20 年となる。","Ｂが高齢となり、バリアフリーのマンションに転居するための資金が必要になった場合、 Ｂは、Ｃの承諾を得ずに甲建物を第三者Ｄに賃貸することができる。","Ｃには、Ｂに対し、配偶者居住権の設定の登記を備えさせる義務がある。","Ｃは、甲建物の通常の必要費を負担しなければならない。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"未成年者Ａが、法定代理人Ｂの同意を得ずに、Ｃから甲建物を買い受ける契約","a":["ＡがＢの同意を得ずに制限行為能力を理由として本件売買契約を取り消した場合、Ｂは、 自己が本件売買契約の取消しに同意していないことを理由に、Ａの当該取消しの意思表示を 取り消すことができる。","本件売買契約締結時にＡが未成年者であることにつきＣが善意無過失であった場合、Ｂは、 Ａの制限行為能力を理由として、本件売買契約を取り消すことはできない。","本件売買契約につき、取消しがなされないままＡが成年に達した場合、本件売買契約につ いてＢが反対していたとしても、自らが取消権を有すると知ったＡは、本件売買契約を追認 することができ、追認後は本件売買契約を取り消すことはできなくなる。","本件売買契約につき、Ｂが追認しないまま、Ａが成年に達する前にＢの同意を得ずに甲建 物をＤに売却した場合、ＢがＤへの売却について追認していないときでも、Ａは制限行為能 力を理由として、本件売買契約を取り消すことはできなくなる。 4"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"Ａを貸主、Ｂを借主として甲建物の賃貸借契約が令和 5 年 7 月 1 日に締結された","a":["甲建物の修繕が必要であることを、Ａが知ったにもかかわらず、Ａが相当の期間内に必要 な修繕をしないときは、Ｂは甲建物の修繕をすることができる。","甲建物の修繕が必要である場合において、ＢがＡに修繕が必要である旨を通知したにもか かわらず、Ａが必要な修繕を直ちにしないときは、Ｂは甲建物の修繕をすることができる。","Ｂの責めに帰すべき事由によって甲建物の修繕が必要となった場合は、Ａは甲建物を修繕 する義務を負わない。","甲建物の修繕が必要である場合において、急迫の事情があるときは、Ｂは甲建物の修繕を することができる。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"債務者Ａが所有する甲土地には、債権者Ｂが一番抵当権（債権額 1,000 万円）","a":["0円","200 万円","400 万円","800 万円 5"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"ＡがＢとの間で、Ａ所有の甲土地につき建物所有目的で期間を 50 年とする賃貸","a":["本件契約に、当初の 10 年間は地代を減額しない旨の特約を定めた場合、その期間内は、 ＢはＡに対して地代の減額請求をすることはできない。","本件契約が甲土地上で専ら賃貸アパート事業用の建物を所有する目的である場合、契約の 更新や建物の築造による存続期間の延長がない旨を定めるためには、公正証書で合意しなけ ればならない。","本件契約に建物買取請求権を排除する旨の特約が定められていない場合、本件契約が終了 したときは、その終了事由のいかんにかかわらず、ＢはＡに対してＢが甲土地上に所有して いる建物を時価で買い取るべきことを請求することができる。","本件契約がＢの居住のための建物を所有する目的であり契約の更新がない旨を定めていな い契約であって、期間満了する場合において甲土地上に建物があり、Ｂが契約の更新を請求 したとしても、Ａが遅滞なく異議を述べ、その異議に更新を拒絶する正当な事由があると認 められる場合は、本件契約は更新されない。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"令和 5 年 7 月 1 日に締結された建物の賃貸借契約（定期建物賃貸借契約及び一時","a":["期間を 1 年未満とする建物の賃貸借契約は、期間を 1 年とするものとみなされる。","当事者間において、一定の期間は建物の賃料を減額しない旨の特約がある場合、現行賃料 が不相当になったなどの事情が生じたとしても、この特約は有効である。","賃借人が建物の引渡しを受けている場合において、当該建物の賃貸人が当該建物を譲渡す るに当たり、当該建物の譲渡人及び譲受人が、賃貸人たる地位を譲渡人に留保する旨及び当 該建物の譲受人が譲渡人に賃貸する旨の合意をしたときは、賃貸人たる地位は譲受人に移転 しない。","現行賃料が定められた時から一定の期間が経過していなければ、賃料増額請求は、認めら れない。 6"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"},{"q":"建物の区分所有等に関する法律（以下この問において「法」という。）に関する","a":["集会においては、法で集会の決議につき特別の定数が定められている事項を除き、規約で 別段の定めをすれば、あらかじめ通知した事項以外についても決議することができる。","集会は、区分所有者の 4 分の 3 以上の同意があるときは、招集の手続を経ないで開くこと ができる。","共用部分の保存行為は、規約に別段の定めがある場合を除いて、各共有者がすることがで きるため集会の決議を必要としない。","一部共用部分に関する事項で区分所有者全員の利害に関係しないものについての区分所有 者全員の規約は、当該一部共用部分を共用すべき区分所有者が 8 人である場合、 3 人が反対 したときは変更することができない。"],"c":0,"tag":"権利関係","area":"pdf_r","year":"R5"}];
QUESTIONS.pdf_l = [{"q":"不動産の登記に関する次の記述のうち、不動産登記法の規定によれば、誤ってい","a":["登記官は、一筆の土地の一部が別の地目となったときであっても、職権でその土地の分筆 の登記をすることができない。","登記事項証明書の交付の請求は、請求情報を電子情報処理組織を使用して登記所に提供す る方法によりすることができる。","権利に関する登記の申請は、法令に別段の定めがある場合を除き、登記権利者及び登記義 務者が共同してしなければならない。","建物の合併の登記は、表題部所有者又は所有権の登記名義人以外の者は、申請することが できない。 7 AB.indd 7 2025/08/22 18:29:08"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R7"},{"q":"都市計画法に関する次の記述のうち、誤っているものはどれか。","a":["風致地区は、都市の風致を維持するため定める地区であり、当該地区内における建築物の 建築について、政令の定める基準に従い、地方公共団体の条例で、都市の風致を維持するた め必要な規制をすることができる。","特定街区は、 市街地の整備改善を図るため街区の整備又は造成が行われる地区につい て、その街区内における建築物の容積率並びに建築物の高さの最高限度及び壁面の位置の制 限を定める街区である。","近隣商業地域は、近隣の住宅地の住民に対する日用品の供給を行うことを主たる内容とす る商業その他の業務の利便を増進するため定める地域である。","生産緑地地区は、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住 居の環境を保護するため定める地区である。"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R7"},{"q":"都市計画法に関する次の記述のうち、正しいものはどれか。ただし、この問にお","a":["市街化調整区域のうち開発許可を受けた開発区域以外の区域において行う、学校教育法に 規定する学校の新築については、都道府県知事の許可が不要である。","開発行為とは、主として建築物の建築又は特定工作物の建設の用に供する目的で行う土地 の区画形質の変更をいい、ゴルフコースの建設は開発行為にはあたらない。","区域区分が定められていない都市計画区域において、商業施設の建築の用に供する目的で 行う 4,000 m2 の開発行為は都道府県知事の許可が不要である。","自己の居住の用に供する住宅の建築を目的として行う開発行為以外の開発行為にあって は、原則として開発区域内に建築基準法に規定する災害危険区域内の土地を含んではならな い。 8 AB.indd 8 2025/08/22 18:29:08"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R7"},{"q":"建築基準法に関する次の記述のうち、誤っているものはどれか。","a":["建築主は、建築確認が必要な建築物を建築しようとする場合は、当該建築物の計画を建築 基準法令の規定に適合させるだけでなく、建築基準法令の規定以外の宅地造成及び特定盛土 等規制法などの建築基準関係規定にも適合するものであることについて確認を受ける必要が ある。","建築主は、 2 階建ての木造住宅を新築しようとする場合は、当該工事に着手する前に、そ の計画が建築基準関係規定に適合するものであることについて、確認を受け、確認済証の交 付を受ける措置が必要となるが、当該住宅の大規模の修繕をしようとする場合には、当該措 置は不要である。","延べ面積が 1,000 m2 を超える木造建築物は、その外壁及び軒裏で延焼のおそれのある部 分を防火構造としなければならない。","高さ 1 m 以下の階段の部分には、手すりを設けなくてもよい。"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R7"},{"q":"次の記述のうち、建築基準法（以下この問において「法」という。）の規定によ","a":["都市再生特別地区内においては、建築物の容積率、建蔽率及び建築面積は当該地区に関す る都市計画において定められた内容に適合するものでなければならないが、その高さは法第 56 条の高さの制限に関する規定に適合させる必要がある。","2 階建てかつ床面積 1,000 m2 の飲食店は、第一種低層住居専用地域、第二種低層住居専 用地域、第一種中高層住居専用地域、工業専用地域及び田園住居地域に建築することができ ない。","特定行政庁による認可を受けて公告された建築協定は、その後、当該協定の土地の所有者 等の全員で合意したときに限り、その公告のあった日以後において当該建築協定区域内の土 地の所有者等となった者に対しても効力が及ぶこととなる。","建築物のエネルギー消費性能の向上のため必要な外壁等に関する工事を行う場合、公益性 が高いことから特定行政庁の許可を受けることなく、法第 52 条の規定による容積率の限度 を超えることができる。 9 AB.indd 9 2025/08/22 18:29:09"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R7"},{"q":"都市計画法（以下この問において「法」という。","a":["市街化区域内において行う、医療法に規定する病院を建築するための 1,000 m2 の開発行 為については、法第 29 条に基づく都道府県知事の許可を得る必要がある。","市街化区域内において行う、開発行為を伴わない建築物の建築で、当該建築物の床面積が",",000 m2 以上のものについては、法第 29 条に基づく都道府県知事の許可を得る必要がある。","市街化調整区域内において行う、都市計画事業の施行のための開発行為については、法第"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R6"},{"q":"建築基準法に関する次の記述のうち、誤っているものはどれか。なお、建築副主","a":["高さ 25 m の建築物には、周囲の状況によって安全上支障がない場合を除き、有効に避雷 設備を設けなければならない。","特定行政庁は、建築基準法の規定に違反した建築物（国、都道府県又は建築主事を置く市 町村の建築物を除く。 ）の所有者に対して、緊急の必要があり、仮に当該建築物の使用禁止 又は使用制限の命令をする場合であっても、意見書の提出先等を記載した通知書の交付等の 手続をとらなければならない。","防火地域内に存在する共同住宅（その用途に供する部分の床面積の合計が 300 m2）を増 築する場合、その増築に係る部分の床面積の合計が 10 m2 以内であっても、建築主事、建築 副主事又は指定確認検査機関の確認を受ける必要がある。","劇場の用途に供する建築物を映画館（その用途に供する部分の床面積の合計が 500 m2） に用途変更する場合、建築主事、建築副主事又は指定確認検査機関の確認を受ける必要はな い。 8"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R6"},{"q":"次の記述のうち、建築基準法の規定によれば、正しいものはどれか。","a":["客席部分の床面積の合計が 300 m2 の映画館については、第二種住居地域内において建築 することはできないが、準住居地域内においては建築することができる。","特定用途誘導地区内において、都市計画で建築物の高さの最高限度が定められていたとし ても、特定行政庁が用途上又は構造上やむを得ないと認めて許可したものについては、当該 最高限度を超えてよい。","計画しようとする建築物の天空率が、道路斜線制限、隣地斜線制限又は北側斜線制限に適 合する建築物の天空率未満であれば、これらの制限は適用されない。","都市計画で建蔽率の限度が 80 ％ に指定されている区域かつ防火地域内にある耐火建築物 について、建蔽率の限度を超えるためには、特定行政庁による許可を得る必要がある。"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R6"},{"q":"都市計画法に関する次の記述のうち、正しいものはどれか。","a":["市街化調整区域は、土地利用を整序し、又は環境を保全するための措置を講ずることなく 放置すれば、将来における一体の都市としての整備に支障が生じるおそれがある区域とされ ている。","高度利用地区は、土地の合理的かつ健全な高度利用と都市機能の更新とを図るため、都市 計画に、建築物の高さの最低限度を定める地区とされている。","特定用途制限地域は、用途地域が定められている土地の区域内において、都市計画に、制 限すべき特定の建築物等の用途の概要を定める地域とされている。","地区計画は、用途地域が定められている土地の区域のほか、一定の場合には、用途地域が 定められていない土地の区域にも定めることができる。"],"c":0,"tag":"法令上の制限","area":"pdf_l","year":"R5"}];
QUESTIONS.pdf_t = [{"q":"土地の売買による所有権の移転登記等に係る登録免許税の税率の軽減措置に関す","a":["この税率の軽減措置は、地目が雑種地となっている土地の売買による所有権の移転登記に ついても適用される。","この税率の軽減措置の適用対象となる土地は、その価額が 1,000 万円未満のものに限られ る。","この税率の軽減措置は、法人が土地の売買による所有権の移転登記を受ける場合には適用 されない。","この税率の軽減措置の適用対象となる土地は、その面積が 1,000 m2 未満のものに限られ る。"],"c":0,"tag":"鑑定評価","area":"pdf_t","year":"R7"},{"q":"固定資産税に関する次の記述のうち、正しいものはどれか。","a":["住宅用地のうち小規模住宅用地（200 m2 以下） に対して課する固定資産税の課税標準 は、当該小規模住宅用地に係る固定資産税の課税標準となるべき価格の 3 分の 1 の額であ る。","市町村長は、納税義務者等の求めに応じ、法令で定めるところにより固定資産課税台帳を 閲覧に供しなければならない。ただし、当該部分に記載されている住所が明らかにされるこ とにより人の生命又は身体に危害を及ぼすおそれがある場合、当該住所を削除する等の措置 を講じたもの又はその写しを閲覧に供することができる。","市町村は、土地、家屋又は償却資産に対して課する固定資産税額が、土地にあっては 30 万円、家屋にあっては 20 万円、償却資産にあっては 150 万円に満たない場合においては、 原則として固定資産税を課することができない。","固定資産税は、固定資産の所有者として、登記簿又は土地補充課税台帳若しくは家屋補充 課税台帳に所有者として登記又は登録されている者に対して課されるため、所有者として登 記又は登録されている個人が賦課期日前に死亡している場合、固定資産課税台帳に新たな所 有者が登録されていなければ何人に対しても固定資産税を課することはできない。"],"c":0,"tag":"鑑定評価","area":"pdf_t","year":"R7"},{"q":"不動産の鑑定評価に関する次の記述のうち、不動産鑑定評価基準によれば、誤っ","a":["価格形成要因のうち個別的要因とは、一般経済社会における不動産のあり方及びその価格 の水準に影響を与える要因をいい、自然的要因、社会的要因、経済的要因及び行政的要因に 大別される。","収益還元法は、賃貸用不動産又は賃貸以外の事業の用に供する不動産の価格を求める場合 に特に有効な手段であり、自用の不動産であっても賃貸を想定することにより適用される。","原価法における減価修正の方法としては、耐用年数に基づく方法と、観察減価法の 2 つの 方法があり、これらは併用するものとする。","対象建築物に関する工事が完了していない場合でも、当該工事の完了を前提として鑑定評 価を行うことがある。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａ（消費税課税事業者）及び宅地建物取引業者Ｂ（消費税課税","a":["4 万円（消費税等相当額を含まない。）、権利金 1,400 万円（権利設定の対価として支払わ れるもので、返還されないものをいい、消費税等相当額を含まない。）の賃貸借契約を成立 させ、依頼者の双方からそれぞれ 52 万 8,000 円を報酬として受領したことは、宅地建物取 引業法に違反する。 イ 現に長期間にわたって居住の用、事業の用その他の用途に供されておらず、かつ将来にわ たり居住の用、 事業の用その他の用途に供される見込みがない宅地（ 1 か月の借賃 5 万 円。消費税等相当額を含まない。）について、Ａは貸主から代理を依頼され、Ｂは借主から 代理を依頼され、賃貸借契約が成立したので、Ａは貸主から 4 万円を、Ｂは、代理の依頼を 受けるに当たって、報酬が借賃の 1.1 か月分を超えることについて借主から承諾を得たうえ で、借主から 7 万円を報酬として受領したことは、宅地建物取引業法に違反しない。 ウ Ａは売主から媒介の依頼を、Ｂは買主から媒介の依頼を、それぞれ受けて、代金 200 万円 （消費税等相当額を含み、土地代金は 90 万円である。）の土地付建物の売買契約を成立させ た場合に、依頼者と宅地建物取引業者との間であらかじめ報酬の額を定めていなかったとき は、売主はＡに対して少なくとも 10 万 4,500 円、買主はＢに対して少なくとも 10 万 4,500 円を支払わなければならない。","ア、イ","イ、ウ","ア、ウ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者が行う宅地建物取引業法第 35 条に規定する重要事項の説明及","a":["宅地建物取引業者は、区分所有建物の売買の媒介を行う場合に、当該一棟の建物及びその 敷地の管理が法人に委託されているときは、その委託を受けている法人の商号又は名称及び 主たる事務所の所在地を説明しなければならない。","宅地建物取引業者は、自身が売主となる場合に、重要事項説明書の交付に当たり、専任の 宅地建物取引士をして当該書面に記名させなければならず、また、買主にも当該書面に記名 させなければならない。","宅地建物取引業者は、重要事項を説明する際には、宅地建物取引業者の事務所において行 わなければならない。","宅地建物取引業者は、自身が売主となる場合であっても、買主に対して、天災その他不可 抗力による損害の負担に関する定めがあるときは、その内容を説明しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者の業務に関する次の記述のうち、宅地建物取引業法（以下この","a":["一つ","二つ","三つ","なし"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａが宅地建物取引業法第 37 条の規定により交付すべき書面","a":["Ａが媒介により事業用宅地の賃貸借契約を成立させた場合、37 条書面を交付しなければ ならないが、契約の当事者Ｂが宅地建物取引業者であるときは、交付する必要はない。","Ａが自ら売主としてＣと既存の建物の売買契約を締結した場合、建物の構造耐力上主要な 部分等の状況について当事者の双方が確認した事項を 37 条書面に記載しなければならない。","ＡがＤを売主としＥを買主とする宅地の売買契約を媒介した場合、天災その他不可抗力に よる損害の負担に関する定めがないときは、定めがない旨を 37 条書面に記載しなければな らない。","Ａが自ら売主としてＦと建物の売買契約を締結した場合、代金についての金銭の貸借の あっせんに関する定めがある場合における当該あっせんに係る金銭の貸借が成立しないとき の措置については、37 条書面に記載する必要はない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"いずれも宅地建物取引業者であるＡ社、Ｂ社及びＣ社（以下この問において「売","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"次の記述のうち、宅地建物取引業法により禁止されている行為が含まれているも","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者ではないＢとの間で","a":["Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金 200 万円を受 領し、さらに建築工事中に 200 万円を中間金として受領した後、当該手付金と中間金につい て法第 41 条に定める保全措置を講じた。","Ａは、建築工事完了後のマンションの売買契約を締結する際に、法第 41 条の 2 に定める 保全措置を講じることなくＢから手付金 400 万円を受領した。","Ａは、建築工事完了前のマンションの売買契約を締結する際にＢから手付金 500 万円を受 領したが、Ｂに債務不履行がないにもかかわらず当該手付金 500 万円を返還して、契約を一 方的に解除した。","Ａは、建築工事完了後のマンションの売買契約を締結する際に、当事者の債務の不履行を 理由とする契約の解除に伴う損害賠償の予定額を 1,000 万円とする特約を定めた。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａが行う業務に関する次の記述のうち、宅地建物取引業法の規","a":["7 条書面だけでなく、売主に交付する 37 条書面についても、当該抵当権の内容を記載しな ければならない。 エ 建物の賃貸借の媒介をするＡは、37 条書面を交付するに当たり、宅地建物取引士をして、 その内容を説明させなければならない。","一つ","二つ","三つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業の免許（以下この問において「免許」という。）に関する次の記","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａ（甲県知事免許）の営業保証金に関する次の記述のうち、宅","a":["免許の有効期間満了の際、Ａが営業保証金を取り戻そうとする場合には、供託した営業保 証金につき還付を受ける権利を有する者に対し、 6 か月を下らない一定期間内に申し出るべ き旨を官報に公告しなければならない。","Ａが営業保証金を供託する場合において、金銭と有価証券を併用して供託することができ るが、従たる事務所を設置したときの営業保証金については、金銭のみをもって供託しなけ ればならない。","Ａは、事業の開始後新たに乙県に従たる事務所を設置したときは、従たる事務所の最寄り の供託所に営業保証金を供託し、その供託物受入の記載のある供託書の写しを添付して、そ の旨を甲県知事に届け出なければならない。","Ａの設置した支店においてＡと宅地建物取引業に関する取引をした者は、その取引により 生じた債権に関し、500 万円を限度としてその債権の弁済を受ける権利を有する。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａの業務に関する次の記述のうち、宅地建物取引業法の規定に","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却について媒介の依頼を受","a":["ＡがＢとの間で専属専任媒介契約を締結し、Ｂから「売り出し中であることを秘密にして おきたいので指定流通機構への登録はしないでほしい」旨の申出があった場合、Ａは、その ことを理由に登録をしなかったとしても法に違反しない。","Ａは、Ｂとの間で有効期間を 1 か月とする専属専任媒介契約を締結する際、「Ｂが媒介契 約を更新する旨を申し出ない場合は、有効期間満了により自動更新するものとする」旨の特 約は有効である。","ＡがＢと一般媒介契約を締結したときは、法第 34 条の 2 第 1 項の規定に基づき交付すべ き書面に、宅地建物取引士をして記名させなければならない。","ＡがＢとの間で専属専任媒介契約を締結した場合、Ａは、当該中古住宅の取引の申込みの 受付に関する状況を指定流通機構に登録しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者Ａが、自ら売主として、宅地建物取引業者Ｂの媒介により、宅","a":["7 条の 2 の規定に基づくいわゆるクーリング・オフに関する次の記述のうち、正しいものは いくつあるか。 ア Ｃは、Ｂの事務所で買受けの申込みを行い、その 3 日後に、Ｃの自宅近くの喫茶店で売買 契約を締結した場合、クーリング・オフによる契約の解除はできない。 イ ＡとＣの間で、クーリング・オフによる契約の解除に関し、Ｃは契約の解除の書面をクー リング・オフの告知の日から起算して 8 日以内にＡに到達させなければ契約を解除すること ができない旨の特約を定めた場合、当該特約は無効である。 ウ Ｃは、Ｂからの提案によりＣの自宅で買受けの申込みを行ったが、クーリング・オフにつ いては告げられず、その 10 日後に、Ａの事務所で売買契約を締結した場合、クーリング・ オフによる契約の解除はできない。 エ クーリング・オフについてＣに告げる書面には、Ａの商号又は名称及び住所並びに免許証 番号を記載しなければならないが、Ｂの商号又は名称及び住所並びに免許証番号の記載は必 要ない。","一つ","二つ","三つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法の規定によれば、正","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"宅地建物取引業者は、犯罪による収益の移転防止に関する法律第 2 条第 2 項の特","a":["Ａは、土地付建物の売買を行うに際して、当該売買契約の相手方である買主が自然人で あったので、氏名、住居、生年月日、取引を行う目的及び職業について、確認した。","Ａは、価額が 5,000 万円の土地付建物の売買を行ったとき、直ちに、一定の方法により、 当該売買契約の相手方である買主の確認記録を検索するための事項、当該取引の期日及び内 容その他の事項に関する記録を作成して保存していたが、当該取引の行われた日から 5 年経 過したので、当年度末に当該記録を廃棄した。","Ａは、土地付建物の売買契約の相手方である買主から収受した代金について犯罪により得 た収益であるとの疑いがあったので、速やかに、所定の事項を行政庁に届け出た。","Ａは、 取引時確認、 取引記録等の保存、 疑わしい取引の届出等の措置を的確に行うた め、顧客と実際に接する営業担当者に対する教育訓練を実施した。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"特定住宅瑕疵担保責任の履行の確保等に関する法律に基づく住宅販売瑕疵担保保","a":["宅地建物取引業者は、基準日から 3 週間を経過する日までの間において、当該基準日前","5 年間に自ら売主となる売買契約に基づき宅地建物取引業者ではない買主に引き渡した新 築住宅（保険契約に係る新築住宅を除く。）について、保証金の供託をしていなければなら ない。","宅地建物取引業者は、自ら売主となる売買契約に基づき新築住宅を引き渡す場合だけでな く、新築住宅の売買の媒介をする場合においても、保証金の供託又は保険契約の締結をしな ければならない。","保険契約を締結している宅地建物取引業者は、新築住宅を引き渡した時から 10 年間、構 造耐力上主要な部分の瑕疵によって生じた損害についてのみ当該保険契約に係る保険金を請 求することができる。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R7"},{"q":"住宅借入金等を有する場合の所得税額の特別控除（以下この問において「住宅","a":["令和 6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産 を譲渡した場合の軽減税率の特例の適用を受けているときであっても、令和 6 年分以後の所 得税について住宅ローン控除の適用を受けることができる。","令和 6 年中に居住用家屋を居住の用に供した場合において、その前年において居住用財産 の買換え等の場合の譲渡損失の損益通算の適用を受けているときであっても、令和 6 年分以 後の所得税について住宅ローン控除の適用を受けることができる。","令和 5 年中に居住用家屋の敷地の用に供するための土地を取得した場合において、令和 6 年中に居住用家屋を新築して居住の用に供したときは、令和 5 年分の所得税について住宅 ローン控除の適用を受けることができる。","令和 6 年中に居住用家屋を居住の用に供した場合において、その居住用家屋の取得に係る 住宅借入金等の償還期間等が契約において 3 年とされているときは、令和 6 年以後 3 年間の 所得税について住宅ローン控除の適用を受けることができる。"],"c":0,"tag":"鑑定評価","area":"pdf_t","year":"R6"},{"q":"不動産取得税に関する次の記述のうち、正しいものはどれか。","a":["不動産取得税の課税標準は、不動産を取得した時における当該不動産の売買価格であるか ら、固定資産税の課税標準である固定資産の評価額とは異なるものである。","不動産取得税の課税標準となるべき額が、土地の取得にあっては 10 万円、家屋の取得の うち建築に係るものにあっては 1 戸につき 23 万円、その他のものにあっては 1 戸につき 12 万円に満たない場合においては、不動産取得税が課されない。","不動産取得税は、不動産の取得に対して課される税であるので、法人の合併により不動産 を取得した場合においても、不動産取得税が課される。","令和 6 年 4 月に個人が取得した住宅及び住宅用地に係る不動産取得税の税率は 3 ％ であ るが、住宅以外の家屋及び土地に係る不動産取得税の税率は 4 ％ である。"],"c":0,"tag":"鑑定評価","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業法第 35 条に規定する重要事項の説明に関する次の記述のうち、","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業者Ａに関する次の記述のうち、正しいものはどれか。なお、Ａは","a":["Ａが主たる事務所を移転したことにより、その最寄りの供託所が変更した場合において、 金銭のみをもって営業保証金を供託しているときは、遅滞なく営業保証金を移転後の主たる 事務所の最寄りの供託所に新たに供託しなければならない。","Ａの従業員が運転する車両で現地案内を受けた者が、Ａの従業員の過失による交通事故で ケガをした場合に取得する損害賠償請求権は、Ａが供託した営業保証金の還付の対象債権と なる。","Ａは、金銭と有価証券を併用して供託することができ、有価証券のみで供託する場合の当 該有価証券の価額は、国債証券の場合はその額面金額の 100 分の 90、地方債証券の場合は その額面金額の 100 分の 80 である。","Ａは甲県内にある主たる事務所とは別に、乙県内に新たに従たる事務所を設置したときは、 営業保証金を主たる事務所の最寄りの供託所に供託しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引士に関する次の記述のうち、宅地建物取引業法（以下この問におい","a":["宅地建物取引士資格試験に合格した者は、宅地又は建物の取引に関する実務の経験期間が","年に満たない場合であっても、試験に合格した日から 1 年以内に登録を受けようとすると きには、都道府県知事が指定する講習を受講することにより、宅地建物取引士の登録を受け ることができる。","宅地建物取引士証は、更新を受けることなくその有効期間が経過した場合、その効力を失 うが、当該宅地建物取引士証を都道府県知事に返納する必要はない。","宅地建物取引士は、他人に自己の名義の使用を許し、当該他人がその名義で宅地建物取引 士である旨の表示をしたときは、法第 68 条の規定に基づく処分の対象となるが、当該他人 が宅地建物取引士の登録を受けた者であるときはこの限りでない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"次の記述のうち、宅地建物取引業法（以下この問において「法」という。","a":["国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者が法第 65 条第 1 項の規定による指示に従わない場合、その業務の全部又は一部の停止を命ずることができ、 業務の停止の処分に違反した場合、免許を取り消さなければならない。","国土交通大臣又は都道府県知事は、その免許を受けた宅地建物取引業者の事務所の所在地 を確知できないときは、その事実を公告し、その公告の日から 2 週間を経過しても当該宅地 建物取引業者から申出がないときは、免許を取り消すことができる。","国土交通大臣又は都道府県知事は、法第 66 条の規定による免許の取消しの処分をしよう とするときは、聴聞を行わなければならないが、当該聴聞は、公開することが相当と認めら れる場合を除き、公開されない。","国土交通大臣又は都道府県知事は、法第 66 条の規定による免許の取消しの処分をしたと きはその旨を公告しなければならないが、法第 65 条第 2 項の規定による業務の停止の処分 をしたときはその旨の公告はしなくともよい。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業者Ａが、ＢからＢ所有の中古住宅の売却の依頼を受け、Ｂと専任","a":["Ａは当該中古住宅の売買契約が成立しても、当該中古住宅の引渡しが完了していなければ、 売買契約が成立した旨を指定流通機構に通知する必要はない。","Ｂが宅地建物取引業者である場合は、当該契約が国土交通大臣が定める標準媒介契約約款 に基づくものであるか否かの別を、法第 34 条の 2 第 1 項に規定する書面に記載する必要は ない。","Ａに対して当該中古住宅について買受けの申込みがなかった場合でも、ＡはＢに対して、 当該契約に係る業務の処理状況を 2 週間に 1 回以上報告しなければならないが、その報告は 必ずしも書面で行う必要はない。","Ｂが当該中古住宅について、法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査を実施 する者のあっせんを希望しなかった場合は、Ａは同項に規定する書面に同調査を実施する者 のあっせんに関する事項を記載する必要はない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業者がその業務に関して行う広告に関する次の記述のうち、宅地建","a":["宅地の販売に関する広告をインターネットで行った場合において、当該宅地の売買契約が 成立した後も継続して広告を掲載していた場合、当該広告を掲載し続けることは法第 32 条 の規定に違反する。","建物の所有者と賃貸借契約を締結し、当該建物を自らが貸主となって貸借（転貸）するた めの広告をする場合においては、自らが契約の当事者となって貸借を成立させる旨を当該広 告に明示しなくても、法第 34 条の規定に違反しない。","造成工事に必要とされる法令に基づく許可等の処分があった宅地について、工事完了前に 当該宅地の販売に関する広告をするときは、法令に基づく許可等の処分があったことを明示 すれば、取引態様の別について明示する必要はない。","複数の区画がある分譲地の売買について、数回に分けて広告をする場合は、最初に行う広 告だけではなく、次回以降の広告の都度取引態様の別を明示しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"営業保証金及び宅地建物取引業保証協会（以下この問において「保証協会」とい","a":["宅地建物取引業者で保証協会に加入しようとする者は、その加入しようとする日までに、 政令で定める額の弁済業務保証金分担金を当該保証協会に納付しなければならない。","保証協会の社員と宅地建物取引業に関し取引をした者（宅地建物取引業者に該当する者を 除く。）は、その取引により生じた債権に関し、当該社員が社員ではないとしたならばその 者が供託すべき営業保証金の額に相当する額の範囲内で弁済を受ける権利を有する。","宅地建物取引業者は、保証協会の社員の地位を失ったときは、保証協会が弁済業務保証金 の還付請求権者に対し、一定期間内に宅地建物取引業法第 64 条の 8 第 2 項の規定による認 証を受けるため申し出るべき旨の公告をした後でなければ、弁済業務保証金分担金の返還を 受けることができない。","宅地建物取引業者は、一部の事務所を廃止し営業保証金を取り戻そうとする場合には、供 託した営業保証金につき還付を請求する権利を有する者に対し、公告をすることなく営業保 証金を取り戻すことができる。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業法第 50 条第 2 項の届出をすべき場所に関する次の記述のうち、","a":["届出をすべき場所として、継続的に業務を行うことができる施設を有する場合で事務所以 外のものが定められているが、当該場所には 1 名以上の成年者である専任の宅地建物取引士 を置かなければならない。","届出をすべき場所として、宅地建物取引業者が 10 区画以上の一団の宅地又は 10 戸以上の 一団の建物の分譲（以下この問において「一団の宅地建物の分譲」という。）をする場合に 設置する案内所が定められているが、当該案内所が土地に定着する建物内に設けられる場合、 クーリング・オフ制度の適用が除外される。","届出をすべき場所として、他の宅地建物取引業者が行う一団の宅地建物の分譲の代理又は 媒介をする場合に設置する案内所が定められており、この場合は、代理又は媒介を行う宅地 建物取引業者が届出をするが、売主業者自身も当該案内所で売買契約の申込みを受ける場合 は、売主業者も届出をする。","届出をすべき場所として、宅地建物取引業者が業務に関し展示会その他これに類する催し を実施する場所が定められているが、その催しを開始する 10 日前までに、実施場所を管轄 する都道府県知事に届け出なければならず、免許を受けた国土交通大臣又は都道府県知事に 届け出る必要はない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引業者が媒介により既存建物の貸借の契約を成立させた場合、宅地建","a":["ア、イ","イ、ウ","ウ、エ","ア、エ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"次の記述のうち、宅地建物取引業法の規定及び「宅地建物取引業者による人の死","a":["宅地建物取引業者は、宅地建物取引業に係る契約の締結の勧誘をするに際し、宅地建物取 引業者の相手方等に対し、利益を生ずることが確実であると誤解させるべき断定的判断を提 供する行為をしてはならない。","宅地建物取引業者は、宅地又は建物の売買の契約の締結の勧誘をするに際し、宅地建物取 引業者の相手方等に対し、宅地又は建物の引渡しの時期について故意に不実のことを告げた 場合であっても、契約が成立したときに宅地建物取引業法第 37 条の規定により交付すべき 書面に当該事項を正確に記載すればよい。","「宅地建物取引業者による人の死の告知に関するガイドライン」によれば、売買取引の対 象となる居住用不動産において、自然死や日常生活の中での不慮の死が発生した場合であっ ても、過去に人が死亡し、長期間にわたって人知れず放置されたこと等に伴ういわゆる特殊 清掃や大規模リフォーム等が行われていなければ、宅地建物取引業者は、原則として、買主 に対してこれを告げなくてもよい。","「宅地建物取引業者による人の死の告知に関するガイドライン」によれば、賃貸借取引の 対象となる居住用不動産において、自然死や日常生活の中での不慮の死以外の死が発生した 場合であっても、特段の事情がない限り、当該死が発覚してから概ね 3 年間を経過した後は、 宅地建物取引業者は、原則として、借主に対してこれを告げなくてもよい。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"宅地建物取引士の登録及び宅地建物取引士証に関する次の記述のうち、誤ってい","a":["宅地建物取引士の登録を受けている者は、宅地建物取引士証の交付を受けていない場合で も、その住所に変更があれば、登録を受けている都道府県知事に変更の登録を申請しなけれ ばならない。","宅地建物取引士は、宅地建物取引士の信用又は品位を害するような行為をしてはならず、 この行為には宅地建物取引士としての職務に必ずしも直接関係しない行為や私的な行為も含 まれる。","宅地建物取引士は、取引の関係者から請求があったときは、宅地建物取引士証を提示しな ければならないが、その際、個人情報保護の観点から宅地建物取引士証の住所欄にシールを 貼った上で提示することが認められている。","宅地建物取引士証に記載される宅地建物取引士の氏名については現姓を用いなければなら ず、旧姓を併記することは認められていない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R6"},{"q":"印紙税に関する次の記述のうち、正しいものはどれか。なお、以下の契約書はい","a":["売主Ａと買主Ｂが土地の譲渡契約書を 3 通作成し、Ａ、Ｂ及び仲介人Ｃがそれぞれ 1 通ず つ保存する場合、当該契約書 3 通には印紙税が課される。","一の契約書に土地の譲渡契約（譲渡金額 5,000 万円）と建物の建築請負契約（請負金額 6,000 万円）をそれぞれ区分して記載した場合、印紙税の課税標準となる当該契約書の記載 金額は 1 億 1,000 万円である。","「Ｄの所有する甲土地（時価 2,000 万円）をＥに贈与する」旨を記載した贈与契約書を作 成した場合、印紙税の課税標準となる当該契約書の記載金額は、2,000 万円である。","当初作成の「土地を 1 億円で譲渡する」旨を記載した土地譲渡契約書の契約金額を変更す るために作成する契約書で、 「当初の契約書の契約金額を 1,000 万円減額し、9,000 万円と する」旨を記載した変更契約書について、印紙税の課税標準となる当該変更契約書の記載金 額は、1,000 万円である。"],"c":0,"tag":"鑑定評価","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業法第 37 条の規定により交付すべき書面に記載すべき事項を電磁","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業法第 34 条の 2 第 1 項第 4 号に規定する建物状況調査（以下この","a":["建物状況調査とは、建物の構造耐力上主要な部分又は雨水の浸入を防止する部分として国 土交通省令で定めるものの状況の調査であって、経年変化その他の建物に生じる事象に関す る知識及び能力を有する者として国土交通省令で定める者が実施するものをいう。","宅地建物取引業者が建物状況調査を実施する者のあっせんを行う場合、建物状況調査を実 施する者は建築士法第 2 条第 1 項に規定する建築士であって国土交通大臣が定める講習を修 了した者でなければならない。","既存住宅の売買の媒介を行う宅地建物取引業者が売主に対して建物状況調査を実施する者 のあっせんを行った場合、宅地建物取引業者は売主から報酬とは別にあっせんに係る料金を 受領することはできない。","既存住宅の貸借の媒介を行う宅地建物取引業者は、宅地建物取引業法第 37 条の規定によ り交付すべき書面に建物の構造耐力上主要な部分等の状況について当事者の双方が確認した 事項を記載しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業者が行う届出に関する次の記述のうち、宅地建物取引業法の規定","a":["宅地建物取引業者Ａ（甲県知事免許）が、新たに宅地建物取引業を営む支店を甲県内に設 置した場合、Ａはその日から 30 日以内にその旨を甲県知事に届け出なければならない。","宅地建物取引業者Ｂ（乙県知事免許）が、宅地建物取引業者ではないＣとの合併により消 滅した場合、Ｂを代表する役員であった者は、その日から 30 日以内にその旨を乙県知事に 届け出なければならない。","宅地建物取引業者Ｄ（丙県知事免許）が、本店における専任の宅地建物取引士Ｅの退職に 伴い、新たに専任の宅地建物取引士Ｆを本店に置いた場合、Ｄはその日から 30 日以内にそ の旨を丙県知事に届け出なければならない。","宅地建物取引業者Ｇ（丁県知事免許）が、その業務に関し展示会を丁県内で実施する場合、 展示会を実施する場所において売買契約の締結（予約を含む。）又は売買契約の申込みの受 付を行うときは、Ｇは展示会での業務を開始する日の 5 日前までに展示会を実施する場所に ついて丁県知事に届け出なければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業者Ａ（消費税課税事業者）は貸主Ｂから建物の貸借の媒介の依頼","a":["32,000 円を、ＣはＤから 132,000 円をそれぞれ受領した。","一つ","二つ","三つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"次の記述のうち、宅地建物取引業者Ａが行う業務に関して宅地建物取引業法の規","a":["一つ","二つ","三つ","四つ"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"次の記述のうち、宅地建物取引業法の規定によれば、正しいものはどれか。","a":["宅地建物取引業者は、非常勤役員には従業者であることを証する証明書を携帯させる必要 はない。","宅地建物取引業者は、その事務所ごとに従業者名簿を備えなければならないが、取引の関 係者から閲覧の請求があった場合であっても、宅地建物取引業法第 45 条に規定する秘密を 守る義務を理由に、閲覧を拒むことができる。","宅地建物取引業者の従業者は、宅地の買受けの申込みをした者から請求があった場合には、 その者が宅地建物取引業者であっても、その者に従業者であることを証する証明書を提示す る必要がある。","宅地建物取引業者は、従業者名簿を最終の記載をした日から 5 年間保存しなければならな い。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業者Ａが媒介により宅地の売買契約を成立させた場合における宅地","a":["Ａは、買主が宅地建物取引業者であるときは、37 条書面に移転登記の申請時期を記載し なくてもよい。","Ａは、37 条書面を売買契約成立前に、各当事者に交付しなければならない。","Ａは、37 条書面を作成したときは、専任の宅地建物取引士をして 37 条書面に記名させる 必要がある。","Ａは、天災その他不可抗力による損害の負担に関する定めがあるときは、その内容を 37 条書面に記載しなければならない。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"},{"q":"宅地建物取引業保証協会（以下この問において「保証協会」という。）に関する","a":["保証協会の社員は、自らが取り扱った宅地建物取引業に係る取引の相手方から当該取引に 関する苦情について解決の申出が保証協会にあり、保証協会から関係する資料の提出を求め られたときは、正当な理由がある場合でなければ、これを拒んではならない。","保証協会は、社員がその一部の事務所を廃止したことに伴って弁済業務保証金分担金を当 該社員に返還しようとするときは、弁済業務保証金の還付請求権者に対し、一定期間内に認 証を受けるため申し出るべき旨の公告を行わなければならない。","保証協会は、宅地建物取引業者の相手方から、社員である宅地建物取引業者の取り扱った 宅地建物取引業に係る取引に関する損害の還付請求を受けたときは、直ちに弁済業務保証金 から返還しなければならない。","保証協会は、手付金等保管事業について国土交通大臣の承認を受けた場合、社員が自ら売 主となって行う宅地又は建物の売買で、宅地の造成又は建築に関する工事の完了前における 買主からの手付金等の受領について、当該事業の対象とすることができる。"],"c":0,"tag":"宅建業法","area":"pdf_t","year":"R5"}];
QUESTIONS.pdf_z = [{"q":"宅地造成及び特定盛土等規制法に関する次の記述のうち、誤っているものはどれ","a":["工事主は、特定盛土等規制区域内において行われる特定盛土等又は土石の堆積に関する政 令で定める規模の工事の許可の申請をするときは、あらかじめ、主務省令で定めるところに より、 特定盛土等又は土石の堆積に関する工事の施行に係る土地の周辺地域の住民に対 し、説明会の開催その他の当該特定盛土等又は土石の堆積に関する工事の内容を周知させる ため必要な措置を講じなければならない。","宅地造成等工事規制区域内の土地の工事主又は工事施行者は、宅地造成等に伴う災害が生 じないよう、その土地を常時安全な状態に維持するように努めなければならない。","都道府県知事は、宅地造成等工事規制区域内の土地について、宅地造成等に伴う災害の防 止のために必要があると認める場合においては、その土地の所有者、管理者、占有者、工事 主又は工事施行者に対して、擁壁等の設置等の必要な措置をとることを勧告することができ る。","宅地造成等工事規制区域内において行われる宅地造成等に関する工事の許可を受けた工事 主は、当該許可に係る土地の見やすい場所に、主務省令で定めるところにより、氏名又は名 称その他の主務省令で定める事項を記載した標識を掲げなければならない。"],"c":0,"tag":"稅","area":"pdf_z","year":"R7"},{"q":"土地区画整理法に関する次の記述のうち、誤っているものはどれか。","a":["個人施行者は、その者以外に換地計画に係る区域内の宅地を所有する者（当該宅地の所有 権について施行者に対抗することができない者を除く。）がある場合においては、換地計画 について認可を申請しようとするときは、これらの者の同意を得なければならない。","国又は地方公共団体の所有する土地以外であって道路の用に供している土地について は、土地区画整理事業の施行により当該道路に代わるべき道路が設置され、その結果、当該 道路が廃止される場合等においては、換地計画において、当該土地について換地を定めない ことができる。","従前の宅地の所有者及びその宅地について使用収益権を有する者が、仮換地について使用 又は収益を開始することができる日を別に定められたため、従前の宅地について使用し、又 は収益することができなくなったことにより損失を受けた場合においては、施行者は、その 損失を受けた者に対して、通常生ずべき損失を補償しなければならない。","仮換地の指定があった日後、土地区画整理事業の施行による施行地区内の土地及び建物の 変動に係る登記がされるまでの間は、登記の申請人が確定日付のある書類によりその指定前 に登記原因が生じたことを証明した場合を除き、施行地区内の土地及び建物に関しては他の 登記をすることができない。"],"c":0,"tag":"稅","area":"pdf_z","year":"R7"},{"q":"農地に関する次の記述のうち、農地法（以下この問において「法」という。）の","a":["市街化区域外にある農地の転用の申請に係る事業が住宅の用に供される土地の造成だけを 目的としている場合、申請に係る農地の全てを住宅の用に供することが確実と認められない ときには、法第 4 条第 1 項又は法第 5 条第 1 項の許可を受けることができない。","仮設工作物を設置するため、市街化区域外にある農地の所有権を取得しようとする場合に は、法第 5 条第 1 項の許可を受けることができない。","農地の賃貸借は、その登記がなくても、農地の引渡しがあったときは、これをもってその 後その農地について所有権を取得した第三者に対抗することができる。","法人の代表者が、その法人の業務に関し、法第 4 条第 1 項又は法第 5 条第 1 項の規定に違 反して農地の転用をした場合には、その代表者が罰せられるほか、その法人も 300 万円以下 の罰金刑が科せられる。"],"c":0,"tag":"稅","area":"pdf_z","year":"R7"},{"q":"国土利用計画法第 23 条の届出（以下この問において「事後届出」という。）に関","a":["市街化区域内においてＡが所有する面積 3,500 m2 の土地について、Ｂが 2,000 m2、Ｃが",",500 m2 とそれぞれ分割して購入した場合、Ｂ及びＣはともに事後届出を行わなければな らない。","都市計画区域外においてＤが所有する面積 12,000 m2 の土地について、Ｅが担保権の実行 による競売を通じて所有権を取得した場合、Ｅは事後届出を行わなければならない。","Ｆが、自ら所有する市街化調整区域内の 7,000 m2 の土地について、宅地建物取引業者Ｇ と売買契約を締結した場合には、Ｇは契約を締結した日から 1 か月以内に事後届出を行う必 要がある。"],"c":0,"tag":"稅","area":"pdf_z","year":"R7"},{"q":"独立行政法人住宅金融支援機構（以下この問において「機構」という。）に関す","a":["機構は、災害により住宅が滅失した場合におけるその住宅に代わるべき住宅の建設又は購 入に係る貸付金について、一定の元金返済の据置期間を設けることができる。","機構は、証券化支援事業（買取型）において、債務者又は債務者の親族が居住する住宅の みならず、賃貸住宅の建設又は購入に必要な資金の貸付けに係る金融機関の貸付債権につい ても譲受けの対象としている。","機構は、高齢者が自ら居住する住宅に対して行うバリアフリー工事に係る貸付けについ て、貸付金の償還を高齢者の死亡時に一括して行うという制度を設けている。","機構は、市街地の土地の合理的な利用に寄与する一定の建築物の建設に必要な資金の貸付 けを業務として行っている。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R7"},{"q":"宅地建物取引業者が行う広告に関する次の記述のうち、不当景品類及び不当表示","a":["団地（一団の宅地又は建物をいう。）と駅との間の道路距離は、取引する区画のうち駅か ら最も近い区画（マンション及びアパートにあっては、駅から最も近い建物の出入口）を起 点として算出した数値又は駅から最も遠い区画（マンション及びアパートにあっては、駅か ら最も遠い建物の出入口）を起点として算出した数値のいずれかを表示しなければならな い。","新築分譲マンションを販売するに当たり、 住戸により管理費の額が異なる場合であっ て、その全ての住宅の管理費を表示することが困難であるときは、最高額のみで表示するこ とができる。","物件の近くに新設される予定の駅等又はバスの停留所については、当該路線の運行主体が 公表していれば、現に利用できるものではなくても新設予定時期を明示して表示することが できる。","道路距離 80 m につき 1 分間を要するものとして、賃貸物件から最寄りの駅までの徒歩に よる所要時間を算出したところ 15 分 50 秒であった。この場合、当該所要時間を 15 分と表 示してよい。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R7"},{"q":"次の記述のうち、正しいものはどれか。","a":["年次別法人企業統計調査（令和 5 年度。令和 6 年 9 月公表）によれば、令和 5 年度におけ る不動産業の営業利益は 7 兆円を超えているが、前年度に比べ減少した。","建築着工統計調査報告（令和 6 年計。令和 7 年 1 月公表）によれば、令和 6 年の新設住宅 着工戸数は、持家、分譲住宅のいずれにおいても前年に比べ減少した。","令和 7 年地価公示（令和 7 年 3 月公表）によれば、令和 6 年 1 月以降の 1 年間の地価変動 率は、三大都市圏平均では住宅地、商業地ともに上昇となったものの、地方圏平均では住宅 地、商業地ともに下落となった。","令和 7 年版土地白書（令和 7 年 5 月公表）によれば、土地取引について、売買による所有 権の移転登記の件数でその動向を見ると、令和 6 年の全国の土地取引件数は 200 万件を超え ており、前年に比べ大きく増加した。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R7"},{"q":"土地に関する次の記述のうち、最も不適当なものはどれか。","a":["川沿いの低地に堆積している川が運んだ土砂は、重い構造物を支持できる。","砂州や砂丘には、粒径のそろった砂が堆積しており、地下水位が浅い箇所では、液状化し やすくなる。","丘陵地は、山地ほど斜面の勾配がきつくなく、山地に比べ斜面崩壊は生じ難いといえる。","台地は低地より古い時代に形成された地盤であり、一般に構造物を支持できる強度を有し ている。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R7"},{"q":"建物の構造と材料に関する次の記述のうち、最も不適当なものはどれか。","a":["鋼材の素材の鋼は、鉄や炭素などの成分を含んでおり、炭素量が多いものほど、軟質で強 度が小さい。","鋼材は、熱に弱く、さびやすいので、耐火や防錆の処理を施す必要がある。","鋼材は、強度が高く、粘りがあり、比較的小さな断面部材で荷重に耐えることができる。","鋼材の素材の鋼の密度は、木材やコンクリートに比べて大きい。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R7"},{"q":"国土利用計画法（以下この問において「法」という。）第 23 条の届出（以下この","a":["Ａが所有する市街化区域以外の都市計画区域内の 4,000 m2 の土地について、宅地建物取 引業者Ｂが地上権の設定を受ける契約を締結した場合、Ｂは事後届出を行わなければならな い。","宅地建物取引業者Ｃが所有する市街化区域内の 3,000 m2 の土地と宅地建物取引業者Ｄが 所有する都市計画区域外に所在する 12,000 m2 の土地を金銭の授受を伴わずに交換する契約 を締結した場合、Ｃ及びＤはともに事後届出を行う必要はない。","事前届出又は事後届出が必要な土地について、売買契約を締結したにもかかわらず所定の 期間内に当該届出をしなかった者は都道府県知事からの勧告を受けることがあるが、罰則の 適用を受けることはない。","監視区域に指定された市街化区域内に所在する土地 2,500 m2 について売買契約を締結し ようとする当事者は、契約締結の少なくとも 6 週間前までに事前届出を行わなければならな い。"],"c":0,"tag":"稅","area":"pdf_z","year":"R6"},{"q":"建物の構造に関する次の記述のうち、最も不適当なものはどれか。","a":["ラーメン構造は、柱を鉛直方向、梁を水平方向に配置し、接合部を強く固めた構造である。","ブレース構造は、柱や梁などで構成された四角形の対角線上に部材を入れた構造である。","ブレース構造は、骨組全てに用いることが多く、ラーメン構造など他の構造と併用するこ とはない。","壁式構造は、板状の壁と床を箱形に組み、建物とする構造で、原則として、柱や梁は用い ない。"],"c":0,"tag":"統計その他","area":"pdf_z","year":"R6"},{"q":"宅地造成等規制法に関する次の記述のうち、誤っているものはどれか。なお、こ","a":["都道府県知事は、関係市町村長の意見を聴いて、宅地造成工事規制区域内で、宅地造成に 伴う災害で相当数の居住者その他の者に危害を生ずるものの発生のおそれが大きい一団の造 成宅地の区域であって、一定の基準に該当するものを、造成宅地防災区域として指定するこ とができる。","都道府県知事は、その地方の気候、風土又は地勢の特殊性により、宅地造成等規制法の規 定のみによっては宅地造成に伴うがけ崩れ又は土砂の流出の防止の目的を達し難いと認める 場合は、都道府県（地方自治法に基づく指定都市、中核市又は施行時特例市の区域にあって は、それぞれ指定都市、中核市又は施行時特例市）の規則で、宅地造成工事規制区域内にお いて行われる宅地造成に関する工事の技術的基準を強化し、又は付加することができる。","都道府県知事は、宅地造成工事規制区域内の宅地について、宅地造成に伴う災害を防止す るために必要があると認める場合には、その宅地の所有者に対して、擁壁等の設置等の措置 をとることを勧告することができる。","宅地造成工事規制区域内の宅地において、雨水その他の地表水又は地下水を排除するため の排水施設の除却工事を行おうとする場合は、一定の場合を除き、都道府県知事への届出が 必要となる。"],"c":0,"tag":"稅","area":"pdf_z","year":"R5"},{"q":"土地を取得する場合における届出に関する次の記述のうち、正しいものはどれか。","a":["都市計画区域外において、国から一団の土地である 6,000 m2 と 5,000 m2 の土地を購入し た者は、事後届出を行う必要はない。","市街化区域を除く都市計画区域内において、Ａが所有する 7,000 m2 の土地をＢが相続に より取得した場合、Ｂは事後届出を行う必要がある。","市街化区域において、Ｃが所有する 3,000 m2 の土地をＤが購入する契約を締結した場合、 Ｃ及びＤは事後届出を行わなければならない。","重要土地等調査法の規定による特別注視区域内にある 100 m2 の規模の土地に関する所有 権又はその取得を目的とする権利の移転をする契約を締結する場合には、当事者は、一定の 事項を、あらかじめ、内閣総理大臣に届け出なければならない。"],"c":0,"tag":"稅","area":"pdf_z","year":"R5"},{"q":"次の記述のうち、誤っているものはどれか。","a":["令和 // ===== ゲーム状態（タイマーID管理で二重実行防止） =====
let state={floor:0,hp:30,maxHp:30,mp:20,maxMp:20,xp:0,nextXp:100,lv:1,streak:0,correct:0,wrong:0,enemyHp:0,enemyMaxHp:0,currentQuestion:null,answered:false,totalFloors:38,timerId:null};

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function pickQuestion(area){
  const pool=QUESTIONS[area];
  if(!pool||pool.length===0)return null;
  const q=pool[Math.floor(Math.random()*pool.length)];
  let shuffled=shuffle([...q.a]);
  let newCorrect=shuffled.indexOf(q.a[q.c]);
  return{...q,a:shuffled,c:newCorrect};
};};
}

function log(msg){document.getElementById('log').innerHTML=msg}
function addLog(msg){document.getElementById('log').innerHTML+=`<br>${msg}`}

function startBattle(){
  if(state.floor>=state.totalFloors){showVictoryModal();return}
  const floor=FLOORS[state.floor];
  state.currentQuestion=pickQuestion(floor.area);
  state.answered=false;
  if(!state.currentQuestion){
    log('⚠ 問題データ不足。リセットします');
    setTimeout(()=>{state.floor=0;startBattle()},500);
    return;
  }
  let baseHp=60+state.floor*12;
  state.enemyMaxHp=baseHp;state.enemyHp=baseHp;
  document.getElementById('stageInfo').textContent=`第${state.floor+1}戦 • ${floor.name}`;
  document.getElementById('enemySprite').textContent=floor.emoji;
  document.getElementById('enemyName').textContent=floor.title;
  document.getElementById('enemyDesc').textContent=`${state.currentQuestion.tag}`;
  updateEnemyHp();updatePlayerStats();
  log(`⚔ ${floor.title} が現れた！`);
  showQuestion();
}

function showQuestion(){
  const q=state.currentQuestion;if(!q)return;
  const tagClass={r:'r',l:'l',t:'t',z:'z'}[q.area]||'r';
  document.getElementById('answerArea').innerHTML=
    `<div class="area-tag area-tag ${tagClass}">${q.tag}</div>
     <div style="font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.5">${q.q}</div>
     ${q.a.map((ans,i)=>`<button class="ans-btn" data-idx="${i}" onclick="answer(${i})">${ans}</button>`).join('')}`;
}

function answer(idx){
  if(state.answered)return;
  state.answered=true;
  const q=state.currentQuestion;
  if(!q||!q.a){log('⚠ データ異常');state.floor=0;setTimeout(()=>startBattle(),500);return}
  
  const btns=document.querySelectorAll('.ans-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.c)b.classList.add('correct');if(i===idx&&idx!==q.c)b.classList.add('wrong')});

  if(idx===q.c){
    playCorrectSound();
    let dmg=20+Math.floor(state.lv*3)+Math.floor(Math.random()*10);
    state.enemyHp=Math.max(0,state.enemyHp-dmg);
    state.streak++;state.correct++;
    state.xp+=10+state.floor*2;
    document.getElementById('enemySprite').classList.add('hit');
    setTimeout(()=>document.getElementById('enemySprite').classList.remove('hit'),400);
    playHitSound();
    log(`<span class="dmg">⚡${dmg}ダメージ！</span> 正解！ <span class="xp">+${10+state.floor*2}XP</span>`);
    updateEnemyHp();checkLevelUp();
    if(state.enemyHp<=0){
      setTimeout(()=>{playVictorySound();showVictory()},600);

      if(state.timerId)clearTimeout(state.timerId);
      state.timerId=setTimeout(continueBattle,800);
    }

    document.querySelector('.player-panel').classList.add('shake');
    setTimeout(()=>document.querySelector('.player-panel').classList.remove('shake'),500);
    log(`<span class="dmg">💥${dmg}ダメージ！</span> 「${q.a[q.c]}」が正解`);
    updatePlayerStats();
    if(state.hp<=0){
      setTimeout(()=>showGameOver(),600);
    } else {
      if(state.timerId)clearTimeout(state.timerId);
      state.timerId=setTimeout(continueBattle,1200);
    }
  }
}

function continueBattle(){
  state.timerId=null;
  if(state.floor>=state.totalFloors)return;
  state.currentQuestion=pickQuestion(FLOORS[state.floor].area);
  if(!state.currentQuestion){state.floor=0;startBattle();return}
  state.answered=false;
  showQuestion();
}

function updateEnemyHp(){
  const pct=Math.round(state.enemyHp/state.enemyMaxHp*100);
  document.getElementById('enemyHpLabel').textContent=`HP ${state.enemyHp}/${state.enemyMaxHp}`;
  document.getElementById('enemyHpPct').textContent=`${pct}%`;
  document.getElementById('enemyHpBar').style.width=`${pct}%`;
}
function updatePlayerStats(){
  document.getElementById('playerHpVal').textContent=`${state.hp}/${state.maxHp}`;
  document.getElementById('playerHpBar').style.width=`${Math.round(state.hp/state.maxHp*100)}%`;
  document.getElementById('playerMpVal').textContent=`${state.mp}/${state.maxMp}`;
  document.getElementById('playerMpBar').style.width=`${Math.round(state.mp/state.maxMp*100)}%`;
  document.getElementById('playerLv').textContent=state.lv;
  document.getElementById('xpDisplay').textContent=`${state.xp}/${state.nextXp}`;
  const titles=['見習い','戦士','騎士','魔導士','賢者','英雄','伝説'];
  document.getElementById('playerTitle').textContent=titles[Math.min(Math.floor(state.lv/3),titles.length-1)];
}
function checkLevelUp(){
  while(state.xp>=state.nextXp){
    state.xp-=state.nextXp;state.lv++;
    state.nextXp=Math.floor(100*Math.pow(1.15,state.lv-1));
    state.maxHp+=8;state.maxMp+=4;
    state.hp=Math.min(state.hp+20,state.maxHp);
    state.mp=Math.min(state.mp+10,state.maxMp);
    addLog(`<span class="heal">🎉 レベルアップ！ Lv.${state.lv}に！</span>`);
  }
  updatePlayerStats();
}
function showVictory(){
  const floor=FLOORS[state.floor];
  document.getElementById('resultIcon').textContent='🏆';
  document.getElementById('resultTitle').textContent='勝利！';
  document.getElementById('resultDesc').textContent=`${floor.title}を撃破！`;
  document.getElementById('resultDetail').innerHTML=`連続正解:${state.streak}連続<br>レベル:${state.lv}`;
  document.getElementById('resultBtn').textContent=state.floor+1<state.totalFloors?'次の戦闘へ':'最終決戦へ';
  document.getElementById('resultModal').classList.add('show');
}
function showGameOver(){
  document.getElementById('resultIcon').textContent='💀';
  document.getElementById('resultTitle').textContent='敗北…';
  document.getElementById('resultDesc').textContent=`第${state.floor+1}戦で力尽きた…`;
  document.getElementById('resultDetail').innerHTML=`正解数:${state.correct}<br>レベル:${state.lv}`;
  document.getElementById('resultBtn').textContent='もう一度挑戦';
  document.getElementById('resultModal').classList.add('show');
}
function showVictoryModal(){
  document.getElementById('resultIcon').textContent='👑';
  document.getElementById('resultTitle').textContent='完全制覇！';
  document.getElementById('resultDesc').textContent='全敵を撃破！真の宅建マスターだ！';
  document.getElementById('resultDetail').innerHTML=`総正解:${state.correct} 誤答:${state.wrong}<br>最終Lv:${state.lv} 正答率:${Math.round(state.correct/(state.correct+state.wrong)*100)}%`;
  document.getElementById('resultBtn').textContent='もう一度プレイ';
  document.getElementById('resultModal').classList.add('show');
}
function nextBattle(){
  if(state.floor+1>=state.totalFloors||state.hp<=0){
    state.floor=0;state.hp=30;state.maxHp=30;state.mp=20;state.maxMp=20;
    state.xp=0;state.nextXp=100;state.lv=1;state.streak=0;state.correct=0;state.wrong=0;
    document.getElementById('resultModal').classList.remove('show');
    startBattle();
  } else {
    state.floor++;
    state.hp=Math.min(state.hp+10,state.maxHp);
    state.mp=Math.min(state.mp+5,state.maxMp);
    document.getElementById('resultModal').classList.remove('show');
    startBattle();
  }
}
function closeResult(){document.getElementById('resultModal').classList.remove('show')}

startBattle();
</script>
</body>
</html>
